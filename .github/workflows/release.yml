name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gate: the "release" environment has required reviewers (admins) — job waits for approval
    environment: release
    permissions:
      contents: write
      id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5
      - run: npm publish --provenance --access public
      # dist/ is not committed (issue #16) - `npm ci` builds it via `prepare`, and the
      # bundles are attached here so direct-download consumers get them without a build
      - name: Verify built dist files exist
        run: ls -l dist/pptxgen.bundle.js dist/pptxgen.min.js dist/pptxgen.cjs.js dist/pptxgen.es.js
      - name: Create release with the built bundles attached
        run: >
          gh release create "$GITHUB_REF_NAME" --generate-notes
          dist/pptxgen.bundle.js dist/pptxgen.min.js dist/pptxgen.cjs.js dist/pptxgen.es.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
