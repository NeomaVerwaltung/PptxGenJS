name: Bump version

on:
  workflow_dispatch:
    inputs:
      level:
        description: Version increment
        type: choice
        default: patch
        options: [patch, minor, major]

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      # npm version writes package.json, commits and tags v<new>, so the tag
      # checkout satisfies release.yml's "tag matches package.json" check.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.level }}" --message "chore: release v%s"
          git push --follow-tags
